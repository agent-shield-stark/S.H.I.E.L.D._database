<!DOCTYPE html>
<html lang="uk">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>S.H.I.E.L.D. // PERSONNEL FILE</title>

<style>

:root {

    --bg: #02080d;

    --panel: #06131b;

    --cyan: #19cfff;

    --cyan-soft: #5edfff;

    --text: #d9f3ff;

    --muted: #7194a5;

    --green: #5df2ae;

    --red: #ff5c6c;

}


* {

    box-sizing: border-box;

}


body {

    margin: 0;

    min-height: 100vh;

    color: var(--text);

    font-family:
        "Courier New",
        monospace;

    background:

        linear-gradient(
            rgba(20,130,170,.035) 1px,
            transparent 1px
        ),

        linear-gradient(
            90deg,
            rgba(20,130,170,.035) 1px,
            transparent 1px
        ),

        var(--bg);

    background-size: 50px 50px;

}


/* =========================
   HEADER
   ========================= */

.header {

    border-bottom:
        1px solid
        rgba(25,207,255,.35);

    padding:
        28px
        clamp(20px,5vw,70px);

    background:
        linear-gradient(
            180deg,
            rgba(10,40,55,.35),
            transparent
        );

}


.header-top {

    color: var(--cyan);

    font-size: 12px;

    letter-spacing: 4px;

    margin-bottom: 45px;

}


.header-title {

    margin: 0;

    font-size:
        clamp(38px,7vw,80px);

    font-weight: 300;

    letter-spacing: 6px;

    text-shadow:
        0 0 15px
        rgba(25,207,255,.35);

}


.header-subtitle {

    margin-top: 15px;

    color: var(--muted);

    letter-spacing: 3px;

    font-size: 12px;

}


/* =========================
   MAIN
   ========================= */

.container {

    width:
        min(1100px,90%);

    margin:
        60px auto 100px;

}


/* =========================
   BACK
   ========================= */

.back {

    display: inline-block;

    margin-bottom: 30px;

    padding:
        12px 18px;

    border:
        1px solid
        rgba(25,207,255,.35);

    color: var(--cyan);

    text-decoration: none;

    font-size: 12px;

    letter-spacing: 2px;

    transition: .2s;

}


.back:hover {

    background:
        rgba(25,207,255,.08);

    border-color:
        var(--cyan);

}


/* =========================
   DOSSIER
   ========================= */

.dossier {

    border:
        1px solid
        rgba(25,207,255,.4);

    background:
        linear-gradient(
            135deg,
            rgba(10,30,40,.85),
            rgba(2,10,15,.95)
        );

    padding:
        clamp(25px,5vw,60px);

    position: relative;

    box-shadow:
        0 0 30px
        rgba(0,150,200,.08);

}


.dossier::before,
.dossier::after {

    content: "";

    position: absolute;

    width: 35px;

    height: 35px;

    border-color:
        var(--cyan);

}


.dossier::before {

    top: -1px;

    left: -1px;

    border-top: 2px solid;

    border-left: 2px solid;

}


.dossier::after {

    right: -1px;

    bottom: -1px;

    border-right: 2px solid;

    border-bottom: 2px solid;

}


/* =========================
   DOSSIER TOP
   ========================= */

.dossier-top {

    display: grid;

    grid-template-columns:
        minmax(180px,280px)
        1fr;

    gap: 45px;

    align-items: start;

}


.photo-wrapper {

    aspect-ratio: 3 / 4;

    border:
        1px solid
        rgba(25,207,255,.35);

    background:
        rgba(0,15,22,.8);

    position: relative;

    overflow: hidden;

}


.photo-wrapper img {

    width: 100%;

    height: 100%;

    object-fit: cover;

    display: block;

}


.photo-placeholder {

    width: 100%;

    height: 100%;

    display: flex;

    align-items: center;

    justify-content: center;

    text-align: center;

    padding: 20px;

    color: var(--muted);

    font-size: 10px;

    letter-spacing: 2px;

}


.photo-label {

    position: absolute;

    left: 0;

    right: 0;

    bottom: 0;

    padding: 8px;

    background:
        rgba(2,8,13,.85);

    border-top:
        1px solid
        rgba(25,207,255,.25);

    color: var(--cyan);

    font-size: 9px;

    letter-spacing: 2px;

}


/* =========================
   FILE
   ========================= */

.file-number {

    color: var(--cyan);

    font-size: 12px;

    letter-spacing: 3px;

    margin-bottom: 25px;

}


.character-name {

    font-size:
        clamp(32px,6vw,60px);

    font-weight: 300;

    letter-spacing: 3px;

    margin:
        0 0 15px;

    text-shadow:
        0 0 15px
        rgba(25,207,255,.3);

}


.full-name {

    color: var(--muted);

    font-size: 13px;

    letter-spacing: 2px;

    margin-bottom: 18px;

}


/* =========================
   STATUS
   ========================= */

.status {

    display: inline-flex;

    align-items: center;

    gap: 8px;

    color: var(--green);

    font-size: 12px;

    letter-spacing: 2px;

    margin-bottom: 35px;

}


.status::before {

    content: "";

    width: 7px;

    height: 7px;

    border-radius: 50%;

    background:
        var(--green);

    box-shadow:
        0 0 10px
        var(--green);

}


/* =========================
   INFO
   ========================= */

.info-grid {

    display: grid;

    grid-template-columns:
        repeat(
            auto-fit,
            minmax(180px,1fr)
        );

    gap: 14px;

}


.info-box {

    border-left:
        2px solid
        var(--cyan);

    background:
        rgba(10,35,48,.45);

    padding:
        16px 18px;

}


.info-label {

    color: var(--muted);

    font-size: 9px;

    letter-spacing: 2px;

    margin-bottom: 8px;

}


.info-value {

    font-size: 14px;

}


/* =========================
   SECTIONS
   ========================= */

.section {

    margin-top: 45px;

}


.section-title {

    color: var(--cyan);

    font-size: 12px;

    letter-spacing: 4px;

    margin-bottom: 18px;

    border-bottom:
        1px solid
        rgba(25,207,255,.2);

    padding-bottom: 10px;

}


.section-text {

    color: #b7d0db;

    line-height: 1.8;

    font-size: 15px;

    white-space: pre-line;

}


/* =========================
   ABILITIES
   ========================= */

.abilities {

    display: flex;

    flex-wrap: wrap;

    gap: 10px;

}


.ability {

    border:
        1px solid
        rgba(25,207,255,.35);

    padding:
        9px 14px;

    color: var(--cyan-soft);

    font-size: 11px;

    letter-spacing: 1px;

    background:
        rgba(25,207,255,.03);

}


/* =========================
   CLASSIFIED
   ========================= */

.classified {

    margin-top: 50px;

    border:
        1px solid
        rgba(255,92,108,.3);

    padding: 20px;

    color: #ff8792;

    font-size: 11px;

    letter-spacing: 2px;

}


/* =========================
   LOADING / ERROR
   ========================= */

.loading {

    text-align: center;

    padding: 100px 20px;

    color: var(--cyan);

    letter-spacing: 3px;

    font-size: 13px;

}


.error {

    text-align: center;

    padding: 80px 20px;

    color: var(--red);

    line-height: 1.8;

}


/* =========================
   MOBILE
   ========================= */

@media(max-width:700px) {

    .dossier-top {

        grid-template-columns: 1fr;

    }

    .photo-wrapper {

        max-width: 280px;

        margin: auto;

    }

    .container {

        width: 92%;

        margin-top: 35px;

    }

}

</style>

</head>


<body>


<header class="header">

    <div class="header-top">

        S.H.I.E.L.D. //
        SECURE TERMINAL

    </div>


    <h1 class="header-title">

        PERSONNEL

    </h1>


    <div class="header-subtitle">

        CLASSIFIED PERSONNEL DATABASE //
        LEVEL 04

    </div>

</header>


<main class="container">


<a
    href="characters.html"
    class="back"
>

    ← RETURN TO PERSONNEL DATABASE

</a>


<div id="content">

    <div class="loading">

        > RETRIEVING PERSONNEL FILE...

    </div>

</div>


</main>


<script>

async function loadCharacter() {

    const content =
        document.getElementById(
            "content"
        );


    const params =
        new URLSearchParams(
            window.location.search
        );


    const characterId =
        params.get("id");


    if (!characterId) {

        content.innerHTML = `

            <div class="error">

                > ERROR 404

                <br><br>

                PERSONNEL IDENTIFIER
                NOT FOUND.

            </div>

        `;

        return;

    }


    try {

        const response =
            await fetch(
                "characters-data.json"
            );


        if (!response.ok) {

            throw new Error(
                "DATABASE UNAVAILABLE"
            );

        }


        const data =
            await response.json();


        const characters =
            Array.isArray(data)
                ? data
                : data.characters;


        const character =
            characters.find(
                item =>
                    item.id === characterId
            );


        if (!character) {

            content.innerHTML = `

                <div class="error">

                    > ACCESS ERROR

                    <br><br>

                    PERSONNEL FILE
                    NOT FOUND.

                </div>

            `;

            return;

        }


        renderCharacter(character);


        document.title =
            "S.H.I.E.L.D. // " +
            character.name;


    } catch(error) {

        console.error(error);


        content.innerHTML = `

            <div class="error">

                > DATABASE CONNECTION FAILED.

                <br><br>

                CHECK CHARACTERS-DATA.JSON

            </div>

        `;

    }

}


/* =========================
   RENDER
   ========================= */

function renderCharacter(character) {

    const content =
        document.getElementById(
            "content"
        );


    const abilities =
        Array.isArray(
            character.abilities
        )
        ? character.abilities
        : [];


    const abilitiesHTML =
        abilities.length

        ? `

            <div class="section">

                <div class="section-title">

                    ABILITIES //
                    CAPABILITIES

                </div>


                <div class="abilities">

                    ${abilities
                        .map(
                            ability =>
                            `

                            <span class="ability">

                                ${escapeHTML(
                                    ability
                                )}

                            </span>

                            `
                        )
                        .join("")
                    }

                </div>

            </div>

        `

        : "";


    const photoHTML =
        character.photo

        ? `

            <img
                src="${escapeAttribute(
                    character.photo
                )}"
                alt="${escapeAttribute(
                    character.name
                )}"
            >

        `

        : `

            <div class="photo-placeholder">

                NO VISUAL DATA AVAILABLE

                <br><br>

                S.H.I.E.L.D.
                ARCHIVE

            </div>

        `;


    content.innerHTML = `

        <article class="dossier">


            <div class="dossier-top">


                <div class="photo-wrapper">

                    ${photoHTML}

                    <div class="photo-label">

                        VISUAL IDENTIFICATION

                    </div>

                </div>


                <div>


                    <div class="file-number">

                        FILE //
                        ${
                            character.file ||
                            character.id
                                .toUpperCase()
                        }

                    </div>


                    <h1 class="character-name">

                        ${escapeHTML(
                            character.name ||
                            "CLASSIFIED"
                        )}

                    </h1>


                    ${
                        character.fullName

                        ? `

                            <div class="full-name">

                                ${escapeHTML(
                                    character.fullName
                                )}

                            </div>

                        `

                        : ""
                    }


                    <div class="status">

                        ${escapeHTML(
                            character.status ||
                            "CLASSIFIED"
                        )}

                    </div>


                    <div class="info-grid">


                        ${infoBox(
                            "ALIAS",
                            character.alias
                        )}


                        ${infoBox(
                            "AGE",
                            character.age
                        )}


                        ${infoBox(
                            "AFFILIATION",
                            character.affiliation
                        )}


                        ${infoBox(
                            "ROLE",
                            character.role
                        )}


                        ${infoBox(
                            "LOCATION",
                            character.location
                        )}


                    </div>


                </div>


            </div>


            ${
                character.description

                ? `

                    <div class="section">

                        <div class="section-title">

                            PERSONNEL SUMMARY

                        </div>

                        <div class="section-text">

                            ${escapeHTML(
                                character.description
                            )}

                        </div>

                    </div>

                `

                : ""
            }


            ${abilitiesHTML}


            ${
                character.personality

                ? `

                    <div class="section">

                        <div class="section-title">

                            PSYCHOLOGICAL PROFILE

                        </div>

                        <div class="section-text">

                            ${escapeHTML(
                                character.personality
                            )}

                        </div>

                    </div>

                `

                : ""
            }


            ${
                character.history

                ? `

                    <div class="section">

                        <div class="section-title">

                            HISTORY

                        </div>

                        <div class="section-text">

                            ${escapeHTML(
                                character.history
                            )}

                        </div>

                    </div>

                `

                : ""
            }


            ${
                character.relationships

                ? `

                    <div class="section">

                        <div class="section-title">

                            RELATIONSHIPS

                        </div>

                        <div class="section-text">

                            ${escapeHTML(
                                character.relationships
                            )}

                        </div>

                    </div>

                `

                : ""
            }


            ${
                character.notes

                ? `

                    <div class="section">

                        <div class="section-title">

                            ARCHIVE NOTES

                        </div>

                        <div class="section-text">

                            ${escapeHTML(
                                character.notes
                            )}

                        </div>

                    </div>

                `

                : ""
            }


            <div class="classified">

                ◈ S.H.I.E.L.D. CLASSIFIED

                <br><br>

                UNAUTHORIZED DISTRIBUTION
                OF THIS FILE IS PROHIBITED.

            </div>


        </article>

    `;

}


/* =========================
   INFO BOX
   ========================= */

function infoBox(
    label,
    value
) {

    if (
        !value ||
        value === "UNKNOWN"
    ) {

        return "";

    }


    return `

        <div class="info-box">

            <div class="info-label">

                ${label}

            </div>


            <div class="info-value">

                ${escapeHTML(
                    value
                )}

            </div>

        </div>

    `;

}


/* =========================
   SECURITY
   ========================= */

function escapeHTML(
    text
) {

    const div =
        document.createElement(
            "div"
        );

    div.textContent =
        text;

    return div.innerHTML;

}


function escapeAttribute(
    text
) {

    return String(text)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        );

}


loadCharacter();

</script>


</body>

</html>
