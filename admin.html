<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>S.H.I.E.L.D. // ADMIN</title>

<style>

* {
    box-sizing: border-box;
}

:root {
    --bg: #02080d;
    --panel: #06131b;
    --panel2: #081a24;
    --line: #0b6385;
    --cyan: #39cfff;
    --cyan2: #8be6ff;
    --green: #5df2a4;
    --red: #ff5577;
    --text: #c9e7f2;
    --muted: #5d91a5;
}

body {
    margin: 0;
    background:
        linear-gradient(rgba(15, 75, 100, .08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(15, 75, 100, .08) 1px, transparent 1px),
        var(--bg);
    background-size: 32px 32px;
    color: var(--text);
    font-family: "Courier New", monospace;
    min-height: 100vh;
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(circle at center, transparent 40%, rgba(0,0,0,.55));
}

.container {
    width: min(1200px, 94%);
    margin: 0 auto;
    padding: 35px 0 80px;
}

/* HEADER */

.header {
    border: 1px solid var(--line);
    padding: 28px;
    margin-bottom: 25px;
    background: rgba(3, 15, 22, .9);
    box-shadow: 0 0 30px rgba(0, 180, 255, .08);
}

.system {
    color: var(--cyan);
    letter-spacing: 4px;
    font-size: 13px;
}

.title {
    font-size: clamp(32px, 6vw, 68px);
    letter-spacing: 8px;
    margin: 22px 0 5px;
    color: var(--cyan2);
    text-shadow: 0 0 15px rgba(57,207,255,.35);
}

.subtitle {
    color: var(--muted);
    letter-spacing: 3px;
}

/* NAV */

.tabs {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-bottom: 20px;
}

.tab {
    background: #041018;
    border: 1px solid #0b4e67;
    color: #69a9bd;
    padding: 16px;
    font-family: inherit;
    cursor: pointer;
    letter-spacing: 2px;
    transition: .2s;
}

.tab:hover,
.tab.active {
    border-color: var(--cyan);
    color: var(--cyan);
    background: #06202b;
    box-shadow: 0 0 15px rgba(57,207,255,.1);
}

/* PANELS */

.panel {
    display: none;
    border: 1px solid #0b4e67;
    background: rgba(4,16,23,.94);
    padding: 25px;
}

.panel.active {
    display: block;
}

.panel-title {
    color: var(--cyan);
    letter-spacing: 4px;
    margin-bottom: 25px;
    font-size: 20px;
}

.section {
    border: 1px solid #0b4055;
    padding: 20px;
    margin-bottom: 20px;
    background: rgba(5,20,28,.7);
}

/* FORM */

label {
    display: block;
    color: #67a8bb;
    font-size: 12px;
    letter-spacing: 2px;
    margin-bottom: 7px;
}

input,
textarea,
select {
    width: 100%;
    border: 1px solid #0b526c;
    background: #020b11;
    color: var(--text);
    padding: 13px;
    font-family: inherit;
    font-size: 14px;
    outline: none;
    margin-bottom: 18px;
}

input:focus,
textarea:focus,
select:focus {
    border-color: var(--cyan);
    box-shadow: 0 0 10px rgba(57,207,255,.1);
}

textarea {
    min-height: 130px;
    resize: vertical;
    line-height: 1.6;
}

.grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 18px;
}

.full {
    grid-column: 1 / -1;
}

/* BUTTONS */

.buttons {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 10px;
}

button {
    border: 1px solid var(--cyan);
    background: #04131b;
    color: var(--cyan);
    padding: 13px 18px;
    font-family: inherit;
    letter-spacing: 2px;
    cursor: pointer;
}

button:hover {
    background: #073040;
    box-shadow: 0 0 15px rgba(57,207,255,.15);
}

button.green {
    border-color: var(--green);
    color: var(--green);
}

button.red {
    border-color: var(--red);
    color: var(--red);
}

button.gray {
    border-color: #446675;
    color: #7fa2ae;
}

/* CHARACTER LIST */

.character-list {
    display: grid;
    gap: 10px;
}

.character-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    padding: 15px;
    border: 1px solid #0b4055;
    background: #031018;
}

.character-info strong {
    color: var(--cyan2);
}

.character-info small {
    color: var(--muted);
}

.character-item button {
    padding: 8px 12px;
    font-size: 11px;
}

/* STATUS */

.status {
    margin-top: 20px;
    padding: 15px;
    border: 1px solid #164b5d;
    color: var(--green);
    min-height: 48px;
}

/* STORY / RULES */

.content-row {
    border: 1px solid #0b4055;
    padding: 20px;
    margin-bottom: 15px;
    background: #031018;
}

.row-head {
    display: flex;
    justify-content: space-between;
    gap: 15px;
    align-items: center;
    margin-bottom: 15px;
}

.row-number {
    color: var(--cyan);
    letter-spacing: 2px;
}

/* MOBILE */

@media(max-width: 700px) {

    .grid {
        grid-template-columns: 1fr;
    }

    .tabs {
        grid-template-columns: 1fr 1fr;
    }

    .character-item {
        flex-direction: column;
        align-items: flex-start;
    }

    .title {
        letter-spacing: 4px;
    }
}

</style>
</head>

<body>

<div class="container">

    <div class="header">
        <div class="system">
            S.H.I.E.L.D. // SECURE ADMIN TERMINAL
        </div>

        <div class="title">
            ADMIN
        </div>

        <div class="subtitle">
            CONTENT MANAGEMENT SYSTEM // LEVEL 10
        </div>
    </div>


    <!-- TABS -->

    <div class="tabs">

        <button class="tab active" data-tab="personnel">
            PERSONNEL
        </button>

        <button class="tab" data-tab="story">
            STORY
        </button>

        <button class="tab" data-tab="rules">
            RULES
        </button>

        <button class="tab" data-tab="main">
            MAIN DATABASE
        </button>

    </div>


    <!-- ================= PERSONNEL ================= -->

    <section id="personnel" class="panel active">

        <div class="panel-title">
            // PERSONNEL DATABASE
        </div>

        <div class="section">

            <label>SELECT PERSONNEL FILE</label>

            <select id="characterSelect">
                <option value="">— NEW CHARACTER —</option>
            </select>

            <div class="grid">

                <div>
                    <label>FILE NUMBER</label>
                    <input id="charFile" placeholder="001">
                </div>

                <div>
                    <label>NAME</label>
                    <input id="charName" placeholder="WANDA MAXIMOFF">
                </div>

                <div>
                    <label>STATUS</label>
                    <input id="charStatus" placeholder="ACTIVE">
                </div>

                <div>
                    <label>SECTION</label>

                    <select id="charSection">
                        <option>Avengers</option>
                        <option>Agents of S.H.I.E.L.D.</option>
                        <option>Other</option>
                    </select>

                </div>

                <div class="full">
                    <label>IMAGE PATH</label>
                    <input id="charImage" placeholder="images/wanda.jpg">
                </div>

                <div class="full">
                    <label>SHORT DESCRIPTION</label>
                    <textarea id="charDescription"></textarea>
                </div>

                <div class="full">
                    <label>HISTORY</label>
                    <textarea id="charHistory"></textarea>
                </div>

                <div class="full">
                    <label>ABILITIES</label>
                    <textarea id="charAbilities"></textarea>
                </div>

                <div class="full">
                    <label>ARCHIVE NOTES</label>
                    <textarea id="charNotes"></textarea>
                </div>

            </div>

            <div class="buttons">

                <button class="green" onclick="saveCharacter()">
                    ✓ SAVE CHARACTER
                </button>

                <button class="red" onclick="deleteCharacter()">
                    ✕ DELETE CHARACTER
                </button>

                <button class="gray" onclick="clearCharacterForm()">
                    CLEAR
                </button>

            </div>

        </div>


        <div class="section">

            <div class="panel-title">
                CURRENT PERSONNEL
            </div>

            <div id="characterList" class="character-list">
                Loading...
            </div>

        </div>

    </section>


    <!-- ================= STORY ================= -->

    <section id="story" class="panel">

        <div class="panel-title">
            // STORY DATABASE
        </div>

        <div class="section">

            <label>STORY TITLE</label>
            <input id="storyTitle">

            <label>STORY SUBTITLE</label>
            <input id="storySubtitle">

        </div>

        <div id="storySections"></div>

        <div class="buttons">

            <button onclick="addStorySection()">
                + ADD STORY SECTION
            </button>

        </div>

    </section>


    <!-- ================= RULES ================= -->

    <section id="rules" class="panel">

        <div class="panel-title">
            // PROTOCOL RULES
        </div>

        <div class="section">

            <label>RULES TITLE</label>
            <input id="rulesTitle">

            <label>RULES SUBTITLE</label>
            <input id="rulesSubtitle">

        </div>

        <div id="rulesSections"></div>

        <div class="buttons">

            <button onclick="addRuleSection()">
                + ADD RULE SECTION
            </button>

        </div>

    </section>


    <!-- ================= MAIN ================= -->

    <section id="main" class="panel">

        <div class="panel-title">
            // MAIN DATABASE
        </div>

        <div class="section">

            <label>MAIN TITLE</label>
            <input id="mainTitle">

            <label>MAIN SUBTITLE</label>
            <input id="mainSubtitle">

            <label>MAIN DESCRIPTION</label>
            <textarea id="mainDescription"></textarea>

        </div>

    </section>


    <!-- ================= EXPORT ================= -->

    <section class="section">

        <div class="panel-title">
            // DATABASE CONTROL
        </div>

        <div class="buttons">

            <button class="green" onclick="exportCharacters()">
                EXPORT PERSONNEL DATABASE
            </button>

            <button class="green" onclick="exportSite()">
                EXPORT SITE DATABASE
            </button>

            <button onclick="exportEverything()">
                EXPORT ALL DATABASES
            </button>

        </div>

        <div id="status" class="status">
            SYSTEM READY.
        </div>

    </section>

</div>


<script>

/* =========================================================
   DATABASE
========================================================= */

let charactersData = {
    characters: []
};

let siteData = {
    main: {
        title: "",
        subtitle: "",
        description: ""
    },

    story: {
        title: "",
        subtitle: "",
        sections: []
    },

    rules: {
        title: "",
        subtitle: "",
        sections: []
    }
};


/* =========================================================
   LOAD DATABASES
========================================================= */

async function loadDatabases() {

    try {

        const charactersResponse =
            await fetch("characters-data.json?cache=" + Date.now());

        if (charactersResponse.ok) {
            charactersData = await charactersResponse.json();
        }

    } catch (error) {

        console.log("Characters database not loaded.");

    }


    try {

        const siteResponse =
            await fetch("site-data.json?cache=" + Date.now());

        if (siteResponse.ok) {
            siteData = await siteResponse.json();
        }

    } catch (error) {

        console.log("Site database not loaded.");

    }


    normalizeData();

    populateCharacterSelect();

    populateCharacterList();

    populateSiteEditor();

    setStatus("DATABASES LOADED.");

}


/* =========================================================
   NORMALIZE
========================================================= */

function normalizeData() {

    if (!Array.isArray(charactersData.characters)) {

        if (Array.isArray(charactersData)) {
            charactersData = {
                characters: charactersData
            };
        } else {
            charactersData.characters = [];
        }

    }


    if (!siteData.main) {

        siteData.main = {
            title: "",
            subtitle: "",
            description: ""
        };

    }


    if (!siteData.story) {

        siteData.story = {
            title: "STORY",
            subtitle: "",
            sections: []
        };

    }


    if (!Array.isArray(siteData.story.sections)) {
        siteData.story.sections = [];
    }


    if (!siteData.rules) {

        siteData.rules = {
            title: "PROTOCOL",
            subtitle: "",
            sections: []
        };

    }


    if (!Array.isArray(siteData.rules.sections)) {
        siteData.rules.sections = [];
    }

}


/* =========================================================
   TABS
========================================================= */

document.querySelectorAll(".tab").forEach(button => {

    button.addEventListener("click", () => {

        document.querySelectorAll(".tab")
            .forEach(btn => btn.classList.remove("active"));

        document.querySelectorAll(".panel")
            .forEach(panel => panel.classList.remove("active"));

        button.classList.add("active");

        document.getElementById(button.dataset.tab)
            .classList.add("active");

    });

});


/* =========================================================
   CHARACTERS
========================================================= */

function populateCharacterSelect() {

    const select = document.getElementById("characterSelect");

    select.innerHTML =
        '<option value="">— NEW CHARACTER —</option>';

    charactersData.characters.forEach((character, index) => {

        const option = document.createElement("option");

        option.value = index;

        option.textContent =
            `${character.file || String(index + 1).padStart(3, "0")} // ${character.name || "CHARACTER"}`;

        select.appendChild(option);

    });

}


document.getElementById("characterSelect")
.addEventListener("change", function() {

    if (this.value === "") {

        clearCharacterForm();
        return;

    }

    const character =
        charactersData.characters[Number(this.value)];

    if (!character) return;

    document.getElementById("charFile").value =
        character.file || "";

    document.getElementById("charName").value =
        character.name || "";

    document.getElementById("charStatus").value =
        character.status || "";

    document.getElementById("charSection").value =
        character.section || "Other";

    document.getElementById("charImage").value =
        character.image || "";

    document.getElementById("charDescription").value =
        character.description || "";

    document.getElementById("charHistory").value =
        character.history || "";

    document.getElementById("charAbilities").value =
        character.abilities || "";

    document.getElementById("charNotes").value =
        character.notes || "";

});


function saveCharacter() {

    const select =
        document.getElementById("characterSelect");

    const character = {

        id:
            slugify(
                document.getElementById("charName").value
            ),

        file:
            document.getElementById("charFile").value,

        name:
            document.getElementById("charName").value,

        status:
            document.getElementById("charStatus").value,

        section:
            document.getElementById("charSection").value,

        image:
            document.getElementById("charImage").value,

        description:
            document.getElementById("charDescription").value,

        history:
            document.getElementById("charHistory").value,

        abilities:
            document.getElementById("charAbilities").value,

        notes:
            document.getElementById("charNotes").value

    };


    if (!character.name.trim()) {

        alert("CHARACTER NAME REQUIRED.");
        return;

    }


    if (select.value === "") {

        charactersData.characters.push(character);

        setStatus("NEW PERSONNEL FILE CREATED.");

    } else {

        const index = Number(select.value);

        charactersData.characters[index] =
            character;

        setStatus("PERSONNEL FILE UPDATED.");

    }


    populateCharacterSelect();

    populateCharacterList();

    clearCharacterForm(false);

}


function deleteCharacter() {

    const select =
        document.getElementById("characterSelect");

    if (select.value === "") {

        alert("SELECT A CHARACTER FIRST.");
        return;

    }

    const index = Number(select.value);

    const character =
        charactersData.characters[index];

    if (!confirm(
        `DELETE ${character.name || "THIS FILE"}?`
    )) return;


    charactersData.characters.splice(index, 1);

    populateCharacterSelect();

    populateCharacterList();

    clearCharacterForm(false);

    setStatus("PERSONNEL FILE DELETED.");

}


function clearCharacterForm(changeSelect = true) {

    if (changeSelect) {

        document.getElementById("characterSelect").value = "";

    }

    document.getElementById("charFile").value = "";

    document.getElementById("charName").value = "";

    document.getElementById("charStatus").value = "";

    document.getElementById("charSection").value =
        "Avengers";

    document.getElementById("charImage").value = "";

    document.getElementById("charDescription").value = "";

    document.getElementById("charHistory").value = "";

    document.getElementById("charAbilities").value = "";

    document.getElementById("charNotes").value = "";

}


function populateCharacterList() {

    const list =
        document.getElementById("characterList");

    list.innerHTML = "";

    if (!charactersData.characters.length) {

        list.innerHTML =
            "<div>NO PERSONNEL FILES.</div>";

        return;

    }


    charactersData.characters.forEach((character, index) => {

        const item =
            document.createElement("div");

        item.className = "character-item";

        item.innerHTML = `

            <div class="character-info">

                <strong>
                    ${escapeHtml(character.name || "UNKNOWN")}
                </strong>

                <br>

                <small>
                    FILE // ${escapeHtml(character.file || "---")}
                    &nbsp; | &nbsp;
                    ${escapeHtml(character.section || "Other")}
                    &nbsp; | &nbsp;
                    ${escapeHtml(character.status || "---")}
                </small>

            </div>

            <button onclick="editCharacter(${index})">
                EDIT
            </button>

        `;

        list.appendChild(item);

    });

}


function editCharacter(index) {

    document.getElementById("characterSelect").value =
        index;

    document.getElementById("characterSelect")
        .dispatchEvent(new Event("change"));

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}


/* =========================================================
   STORY
========================================================= */

function populateSiteEditor() {

    document.getElementById("mainTitle").value =
        siteData.main.title || "";

    document.getElementById("mainSubtitle").value =
        siteData.main.subtitle || "";

    document.getElementById("mainDescription").value =
        siteData.main.description || "";


    document.getElementById("storyTitle").value =
        siteData.story.title || "";

    document.getElementById("storySubtitle").value =
        siteData.story.subtitle || "";


    document.getElementById("rulesTitle").value =
        siteData.rules.title || "";

    document.getElementById("rulesSubtitle").value =
        siteData.rules.subtitle || "";


    renderStorySections();

    renderRuleSections();

}


function renderStorySections() {

    const container =
        document.getElementById("storySections");

    container.innerHTML = "";

    siteData.story.sections.forEach((section, index) => {

        const div =
            document.createElement("div");

        div.className = "content-row";

        div.innerHTML = `

            <div class="row-head">

                <div class="row-number">
                    STORY FILE // ${String(index + 1).padStart(2, "0")}
                </div>

                <button
                    class="red"
                    onclick="removeStorySection(${index})">
                    DELETE
                </button>

            </div>

            <label>SECTION TITLE</label>

            <input
                value="${escapeAttribute(section.title || "")}"
                oninput="siteData.story.sections[${index}].title = this.value">

            <label>SECTION TEXT</label>

            <textarea
                oninput="siteData.story.sections[${index}].text = this.value"
            >${escapeHtml(section.text || "")}</textarea>

        `;

        container.appendChild(div);

    });

}


function addStorySection() {

    siteData.story.sections.push({

        id: "section-" + Date.now(),

        title: "НОВА СЕКЦІЯ",

        text: ""

    });

    renderStorySections();

}


function removeStorySection(index) {

    if (!confirm("DELETE THIS STORY SECTION?")) return;

    siteData.story.sections.splice(index, 1);

    renderStorySections();

}


/* =========================================================
   RULES
========================================================= */

function renderRuleSections() {

    const container =
        document.getElementById("rulesSections");

    container.innerHTML = "";

    siteData.rules.sections.forEach((section, index) => {

        const div =
            document.createElement("div");

        div.className = "content-row";

        div.innerHTML = `

            <div class="row-head">

                <div class="row-number">
                    RULE FILE // ${String(index + 1).padStart(2, "0")}
                </div>

                <button
                    class="red"
                    onclick="removeRuleSection(${index})">
                    DELETE
                </button>

            </div>

            <label>SECTION TITLE</label>

            <input
                value="${escapeAttribute(section.title || "")}"
                oninput="siteData.rules.sections[${index}].title = this.value">

            <label>SECTION TEXT</label>

            <textarea
                oninput="siteData.rules.sections[${index}].text = this.value"
            >${escapeHtml(section.text || "")}</textarea>

        `;

        container.appendChild(div);

    });

}


function addRuleSection() {

    siteData.rules.sections.push({

        id: "rule-" + Date.now(),

        title: "НОВЕ ПРАВИЛО",

        text: ""

    });

    renderRuleSections();

}


function removeRuleSection(index) {

    if (!confirm("DELETE THIS RULE SECTION?")) return;

    siteData.rules.sections.splice(index, 1);

    renderRuleSections();

}


/* =========================================================
   MAIN DATABASE
========================================================= */

document.getElementById("mainTitle")
.addEventListener("input", function() {

    siteData.main.title = this.value;

});


document.getElementById("mainSubtitle")
.addEventListener("input", function() {

    siteData.main.subtitle = this.value;

});


document.getElementById("mainDescription")
.addEventListener("input", function() {

    siteData.main.description = this.value;

});


document.getElementById("storyTitle")
.addEventListener("input", function() {

    siteData.story.title = this.value;

});


document.getElementById("storySubtitle")
.addEventListener("input", function() {

    siteData.story.subtitle = this.value;

});


document.getElementById("rulesTitle")
.addEventListener("input", function() {

    siteData.rules.title = this.value;

});


document.getElementById("rulesSubtitle")
.addEventListener("input", function() {

    siteData.rules.subtitle = this.value;

});


/* =========================================================
   EXPORT
========================================================= */

function downloadJSON(data, filename) {

    const json =
        JSON.stringify(data, null, 2);

    const blob =
        new Blob(
            [json],
            { type: "application/json" }
        );

    const url =
        URL.createObjectURL(blob);

    const link =
        document.createElement("a");

    link.href = url;

    link.download = filename;

    document.body.appendChild(link);

    link.click();

    link.remove();

    URL.revokeObjectURL(url);

}


function exportCharacters() {

    downloadJSON(
        charactersData,
        "characters-data.json"
    );

    setStatus(
        "PERSONNEL DATABASE EXPORTED."
    );

}


function exportSite() {

    downloadJSON(
        siteData,
        "site-data.json"
    );

    setStatus(
        "SITE DATABASE EXPORTED."
    );

}


function exportEverything() {

    downloadJSON(
        charactersData,
        "characters-data.json"
    );

    setTimeout(() => {

        downloadJSON(
            siteData,
            "site-data.json"
        );

    }, 500);

    setStatus(
        "ALL DATABASES EXPORTED."
    );

}


/* =========================================================
   HELPERS
========================================================= */

function slugify(text) {

    return text
        .toLowerCase()
        .trim()
        .replace(/[^a-z0-9а-яіїєґ]+/gi, "-")
        .replace(/^-+|-+$/g, "");

}


function escapeHtml(text) {

    return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");

}


function escapeAttribute(text) {

    return escapeHtml(text)
        .replace(/"/g, "&quot;");

}
