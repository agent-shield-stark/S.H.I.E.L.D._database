<!DOCTYPE html>
<html lang="uk">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>S.H.I.E.L.D. // STORY</title>

<style>

/* =====================================================
   BASE
===================================================== */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    min-height: 100%;
}

body {

    background:
        linear-gradient(
            rgba(0, 80, 120, 0.055) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(0, 80, 120, 0.055) 1px,
            transparent 1px
        ),
        #02080d;

    background-size: 32px 32px;

    color: #c9e8f2;

    font-family:
        "Courier New",
        monospace;

    overflow-x: hidden;
}


/* =====================================================
   SCANLINES
===================================================== */

body::before {

    content: "";

    position: fixed;

    inset: 0;

    pointer-events: none;

    background:
        repeating-linear-gradient(
            0deg,
            rgba(255,255,255,0.012) 0px,
            rgba(255,255,255,0.012) 1px,
            transparent 1px,
            transparent 4px
        );

    z-index: 999;
}


/* =====================================================
   LOADING SCREEN
===================================================== */

#loading-screen {

    position: fixed;

    inset: 0;

    background: #02080d;

    display: flex;

    justify-content: center;

    align-items: center;

    z-index: 5000;

    transition:
        opacity 0.8s ease,
        visibility 0.8s ease;
}


#loading-screen.hidden {

    opacity: 0;

    visibility: hidden;

}


.loading-box {

    width: min(650px, 90%);

    border: 1px solid #0b6385;

    background: rgba(3, 15, 22, 0.96);

    padding: 30px;

    box-shadow:
        0 0 35px rgba(0, 180, 255, 0.12);

}


.loading-header {

    color: #39cfff;

    letter-spacing: 4px;

    margin-bottom: 25px;

}


.loading-terminal {

    min-height: 150px;

    color: #72c8df;

    line-height: 1.8;

    font-size: 13px;

}


.loading-line {

    opacity: 0;

    animation:
        terminalLine 0.25s forwards;

}


@keyframes terminalLine {

    from {
        opacity: 0;
        transform: translateX(-5px);
    }

    to {
        opacity: 1;
        transform: translateX(0);
    }

}


.progress-container {

    margin-top: 20px;

    height: 5px;

    background: #04131b;

    border: 1px solid #0b526c;

}


.progress {

    height: 100%;

    width: 0%;

    background: #39cfff;

    box-shadow:
        0 0 12px #39cfff;

    animation:
        loadingProgress 2.7s forwards;

}


@keyframes loadingProgress {

    from {
        width: 0%;
    }

    to {
        width: 100%;
    }

}


/* =====================================================
   MAIN
===================================================== */

#site {

    opacity: 0;

    transition: opacity 0.8s ease;

}


#site.loaded {

    opacity: 1;

}


.container {

    width: min(1100px, 92%);

    margin: auto;

    padding:
        45px 0
        90px;

}


/* =====================================================
   HEADER
===================================================== */

.header {

    position: relative;

    border:
        1px solid #0b6385;

    background:
        rgba(3, 15, 22, 0.94);

    padding: 30px;

    margin-bottom: 25px;

    box-shadow:
        0 0 30px
        rgba(0, 180, 255, 0.08);

}


.header::before {

    content: "";

    position: absolute;

    left: 0;
    top: 0;

    width: 100%;

    height: 2px;

    background: #39cfff;

    box-shadow:
        0 0 15px #39cfff;

}


.system {

    color: #39cfff;

    font-size: 12px;

    letter-spacing: 4px;

}


.title {

    margin:
        20px 0 8px;

    color: #8be6ff;

    font-size:
        clamp(35px, 7vw, 70px);

    letter-spacing: 7px;

    text-shadow:
        0 0 15px
        rgba(57, 207, 255, 0.35);

}


.subtitle {

    color: #5d91a5;

    letter-spacing: 3px;

    font-size: 12px;

}


/* =====================================================
   DECORATIVE LINE
===================================================== */

.interface-line {

    height: 1px;

    margin:
        25px 0;

    background:
        linear-gradient(
            90deg,
            transparent,
            #0b6385,
            transparent
        );

    position: relative;

}


.interface-line::after {

    content: "";

    position: absolute;

    left: 50%;

    top: -3px;

    width: 7px;

    height: 7px;

    background: #39cfff;

    box-shadow:
        0 0 12px #39cfff;

    transform:
        translateX(-50%)
        rotate(45deg);

}

   <div class="back-button-container">

    <a href="index.html" class="back-button">
        ← RETURN TO DATABASE
    </a>

</div>

/* =====================================================
   BACK TO DATABASE
===================================================== */

.back-button-container {

    margin:
        0 0 22px;

}

.back-button {

    display: inline-block;

    padding:
        12px 18px;

    border:
        1px solid #0b6385;

    background:
        rgba(3, 15, 22, 0.9);

    color: #5db7d4;

    text-decoration: none;

    font-family:
        "Courier New",
        monospace;

    font-size: 11px;

    letter-spacing: 2px;

    transition:
        .25s ease;

}

.back-button:hover {

    color: #8be6ff;

    border-color:
        #39cfff;

    background:
        #06202b;

    box-shadow:
        0 0 15px
        rgba(57, 207, 255, 0.15);

    transform:
        translateX(-3px);

}
   
/* =====================================================
   STORY CONTENT
===================================================== */

#story-content {

    display: flex;

    flex-direction: column;

    gap: 18px;

}


.story-section {

    position: relative;

    border:
        1px solid #0b526c;

    background:
        rgba(4, 17, 24, 0.94);

    padding: 27px;

    box-shadow:
        inset 0 0 25px
        rgba(0, 120, 170, 0.035);

    transition:
        border-color .25s ease,
        box-shadow .25s ease;

}


.story-section:hover {

    border-color: #1687ad;

    box-shadow:
        0 0 18px
        rgba(57, 207, 255, 0.08);

}


.story-section::before {

    content: "";

    position: absolute;

    left: -1px;

    top: 18px;

    width: 3px;

    height: 55px;

    background: #39cfff;

    box-shadow:
        0 0 12px #39cfff;

}


.story-number {

    color: #39cfff;

    font-size: 11px;

    letter-spacing: 3px;

    margin-bottom: 12px;

}


.story-section h2 {

    color: #8be6ff;

    font-size: 21px;

    letter-spacing: 3px;

    margin:
        0 0 20px;

}


.story-content {

    color: #b8d6df;

    font-family:
        Arial,
        sans-serif;

    font-size: 16px;

    line-height: 1.85;

    white-space: pre-line;

}


/* =====================================================
   FOOTER
===================================================== */

.footer {

    margin-top: 30px;

    border:
        1px solid #0b4055;

    padding: 18px;

    text-align: center;

    color: #426b7a;

    font-size: 10px;

    letter-spacing: 3px;

}


/* =====================================================
   ERROR
===================================================== */

.error {

    border:
        1px solid #ff5577;

    color: #ff7892;

    padding: 25px;

    background:
        rgba(60, 5, 20, .2);

    line-height: 1.7;

}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 700px) {

    .container {

        width: 94%;

        padding-top: 25px;

    }

    .header {

        padding: 22px;

    }

    .title {

        letter-spacing: 4px;

    }

    .story-section {

        padding: 22px;

    }

    .story-content {

        font-size: 15px;

    }

}

</style>

</head>


<body>


<!-- =====================================================
     LOADING SCREEN
===================================================== -->

<div id="loading-screen">

    <div class="loading-box">

        <div class="loading-header">
            S.H.I.E.L.D. // SECURE TERMINAL
        </div>

        <div
            class="loading-terminal"
            id="loading-terminal"
        ></div>

        <div class="progress-container">

            <div class="progress"></div>

        </div>

    </div>

</div>


<!-- =====================================================
     SITE
===================================================== -->

<div id="site">

    <div class="container">


        <!-- HEADER -->

        <header class="header">

            <div class="system">
                S.H.I.E.L.D. // CLASSIFIED DATABASE
            </div>

            <div
                class="title"
                id="page-title"
            >
                STORY
            </div>

            <div
                class="subtitle"
                id="page-subtitle"
            >
                CLASSIFIED STORY DATABASE
            </div>

        </header>


        <div class="interface-line"></div>


        <!-- STORY -->

        <main id="story-content">

            <!--
                STORY DATA WILL APPEAR HERE
            -->

        </main>


        <div class="interface-line"></div>


        <footer class="footer">

            S.H.I.E.L.D. DATABASE
            //
            CLASSIFIED INFORMATION
            //
            AUTHORIZED PERSONNEL ONLY

        </footer>


    </div>

</div>


<script>

/* =====================================================
   LOADING TERMINAL
===================================================== */

const terminal =
    document.getElementById(
        "loading-terminal"
    );


const loadingMessages = [

    "INITIALIZING SECURE CONNECTION...",

    "CONNECTING TO S.H.I.E.L.D. DATABASE...",

    "VERIFYING AUTHORIZATION...",

    "ACCESS LEVEL: AUTHORIZED",

    "LOCATING STORY DATABASE...",

    "DECRYPTING FILES...",

    "LOADING NARRATIVE DATA..."

];


loadingMessages.forEach(
    (message, index) => {

        setTimeout(() => {

            const line =
                document.createElement("div");

            line.className =
                "loading-line";

            line.textContent =
                "> " + message;

            terminal.appendChild(line);

        }, index * 260);

    }
);


/* =====================================================
   LOAD STORY DATA
===================================================== */

async function loadStory() {

    try {

        const response =
            await fetch(
                "story-data.json?cache=" +
                Date.now()
            );


        if (!response.ok) {

            throw new Error(
                "story-data.json could not be loaded."
            );

        }


        const data =
            await response.json();


        /* PAGE HEADER */

        document.getElementById(
            "page-title"
        ).textContent =
            data.title || "STORY";


        document.getElementById(
            "page-subtitle"
        ).textContent =
            data.subtitle ||
            "CLASSIFIED STORY DATABASE";


        /* STORY CONTAINER */

        const container =
            document.getElementById(
                "story-content"
            );


        container.innerHTML = "";


        /* CREATE SECTIONS */

        if (
            !data.sections ||
            !Array.isArray(data.sections)
        ) {

            throw new Error(
                "No story sections found."
            );

        }


        data.sections.forEach(
            section => {

                const article =
                    document.createElement(
                        "article"
                    );


                article.className =
                    "story-section";


                const number =
                    document.createElement(
                        "div"
                    );

                number.className =
                    "story-number";


                number.textContent =
                    "FILE // " +
                    (section.number || "00");


                const title =
                    document.createElement(
                        "h2"
                    );


                title.textContent =
                    section.title ||
                    "UNTITLED SECTION";


                const content =
                    document.createElement(
                        "div"
                    );


                content.className =
                    "story-content";


                content.textContent =
                    section.content || "";


                article.appendChild(
                    number
                );

                article.appendChild(
                    title
                );

                article.appendChild(
                    content
                );


                container.appendChild(
                    article
                );

            }
        );


        /* SHOW SITE */

        setTimeout(() => {

            document
                .getElementById(
                    "loading-screen"
                )
                .classList.add(
                    "hidden"
                );


            document
                .getElementById("site")
                .classList.add(
                    "loaded"
                );

        }, 3000);


    } catch (error) {

        console.error(error);


        const container =
            document.getElementById(
                "story-content"
            );


        container.innerHTML = `

            <div class="error">

                <strong>
                    DATABASE ERROR
                </strong>

                <br><br>

                STORY DATABASE COULD NOT
                BE LOADED.

                <br><br>

                CHECK THAT
                <strong>
                    story-data.json
                </strong>
                EXISTS IN THE SAME
                REPOSITORY.

                <br><br>

                ERROR:
                ${error.message}

            </div>

        `;


        document
            .getElementById(
                "loading-screen"
            )
            .classList.add(
                "hidden"
            );


        document
            .getElementById("site")
            .classList.add(
                "loaded"
            );

    }

}


/* =====================================================
   START
===================================================== */

loadStory();

</script>


</body>

</html>
