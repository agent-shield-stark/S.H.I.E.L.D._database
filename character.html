<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>S.H.I.E.L.D. // PERSONNEL FILE</title>

<style>

:root {
    --bg: #02080d;
    --panel: #06131b;
    --panel-light: #081923;
    --cyan: #19cfff;
    --cyan-soft: #5edfff;
    --text: #d9f3ff;
    --muted: #7194a5;
    --green: #5df2ae;
    --red: #ff5c6c;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background:
        linear-gradient(rgba(20,130,170,.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(20,130,170,.035) 1px, transparent 1px),
        var(--bg);

    background-size: 50px 50px;

    color: var(--text);

    font-family:
        "Courier New",
        monospace;

    min-height: 100vh;
}


/* ============================= */
/* HEADER */
/* ============================= */

.header {

    border-bottom: 1px solid rgba(25,207,255,.35);

    padding:
        28px
        clamp(20px, 5vw, 70px);

    background:
        linear-gradient(
            180deg,
            rgba(10,40,55,.35),
            transparent
        );

}

.header-top {

    color: var(--cyan);

    font-size: 12px;

    letter-spacing: 4px;

    margin-bottom: 45px;

}

.header-title {

    font-size:
        clamp(38px, 7vw, 80px);

    font-weight: 300;

    letter-spacing: 6px;

    margin: 0;

    text-shadow:
        0 0 15px rgba(25,207,255,.35);

}

.header-subtitle {

    margin-top: 15px;

    color: var(--muted);

    letter-spacing: 3px;

    font-size: 12px;

}


/* ============================= */
/* MAIN */
/* ============================= */

.container {

    width: min(1100px, 90%);

    margin: 60px auto 100px;

}


/* ============================= */
/* BACK BUTTON */
/* ============================= */

.back {

    display: inline-block;

    margin-bottom: 30px;

    padding: 12px 18px;

    border: 1px solid rgba(25,207,255,.35);

    color: var(--cyan);

    text-decoration: none;

    font-size: 12px;

    letter-spacing: 2px;

    transition: .2s;

}

.back:hover {

    background: rgba(25,207,255,.08);

    border-color: var(--cyan);

}


/* ============================= */
/* DOSSIER */
/* ============================= */

.dossier {

    border: 1px solid rgba(25,207,255,.4);

    background:
        linear-gradient(
            135deg,
            rgba(10,30,40,.85),
            rgba(2,10,15,.95)
        );

    padding:
        clamp(25px, 5vw, 60px);

    position: relative;

    box-shadow:
        0 0 30px rgba(0,150,200,.08);

}


/* decorative corners */

.dossier::before,
.dossier::after {

    content: "";

    position: absolute;

    width: 35px;
    height: 35px;

    border-color: var(--cyan);

}

.dossier::before {

    top: -1px;
    left: -1px;

    border-top: 2px solid;
    border-left: 2px solid;

}

.dossier::after {

    right: -1px;
    bottom: -1px;

    border-right: 2px solid;
    border-bottom: 2px solid;

}


/* ============================= */
/* FILE NUMBER */
/* ============================= */

.file-number {

    color: var(--cyan);

    font-size: 12px;

    letter-spacing: 3px;

    margin-bottom: 25px;

}


/* ============================= */
/* CHARACTER NAME */
/* ============================= */

.character-name {

    font-size:
        clamp(32px, 6vw, 60px);

    font-weight: 300;

    letter-spacing: 3px;

    margin: 0 0 15px;

    text-shadow:
        0 0 15px rgba(25,207,255,.3);

}


/* ============================= */
/* STATUS */
/* ============================= */

.status {

    display: inline-flex;

    align-items: center;

    gap: 8px;

    color: var(--green);

    font-size: 12px;

    letter-spacing: 2px;

    margin-bottom: 45px;

}

.status::before {

    content: "";

    width: 7px;
    height: 7px;

    border-radius: 50%;

    background: var(--green);

    box-shadow:
        0 0 10px var(--green);

}


/* ============================= */
/* INFO GRID */
/* ============================= */

.info-grid {

    display: grid;

    grid-template-columns:
        repeat(
            auto-fit,
            minmax(220px, 1fr)
        );

    gap: 18px;

    margin-bottom: 45px;

}

.info-box {

    border-left: 2px solid var(--cyan);

    background: rgba(10,35,48,.45);

    padding: 18px 20px;

}

.info-label {

    color: var(--muted);

    font-size: 10px;

    letter-spacing: 2px;

    margin-bottom: 10px;

}

.info-value {

    font-size: 16px;

    color: var(--text);

}


/* ============================= */
/* SECTION */
/* ============================= */

.section {

    margin-top: 45px;

}

.section-title {

    color: var(--cyan);

    font-size: 12px;

    letter-spacing: 4px;

    margin-bottom: 18px;

    border-bottom: 1px solid rgba(25,207,255,.2);

    padding-bottom: 10px;

}

.section-text {

    color: #b7d0db;

    line-height: 1.8;

    font-size: 15px;

    white-space: pre-line;

}


/* ============================= */
/* ABILITIES */
/* ============================= */

.abilities {

    display: flex;

    flex-wrap: wrap;

    gap: 10px;

}

.ability {

    border: 1px solid rgba(25,207,255,.35);

    padding: 9px 14px;

    color: var(--cyan-soft);

    font-size: 11px;

    letter-spacing: 1px;

    background: rgba(25,207,255,.03);

}


/* ============================= */
/* CLASSIFIED */
/* ============================= */

.classified {

    margin-top: 50px;

    border: 1px solid rgba(255,92,108,.3);

    padding: 20px;

    color: #ff8792;

    font-size: 11px;

    letter-spacing: 2px;

}


/* ============================= */
/* LOADING */
/* ============================= */

.loading {

    text-align: center;

    padding: 100px 20px;

    color: var(--cyan);

    letter-spacing: 3px;

    font-size: 13px;

}


/* ============================= */
/* ERROR */
/* ============================= */

.error {

    text-align: center;

    padding: 80px 20px;

    color: var(--red);

    line-height: 1.8;

}


/* ============================= */
/* MOBILE */
/* ============================= */

@media (max-width: 600px) {

    .container {

        width: 92%;

        margin-top: 35px;

    }

    .dossier {

        padding: 25px 20px;

    }

    .character-name {

        letter-spacing: 1px;

    }

}

</style>
</head>


<body>


<header class="header">

    <div class="header-top">
        S.H.I.E.L.D. // SECURE TERMINAL
    </div>

    <h1 class="header-title">
        PERSONNEL
    </h1>

    <div class="header-subtitle">
        CLASSIFIED PERSONNEL DATABASE // LEVEL 04
    </div>

</header>


<main class="container">

    <a href="characters.html" class="back">
        ← RETURN TO PERSONNEL DATABASE
    </a>


    <div id="content">

        <div class="loading">
            > RETRIEVING PERSONNEL FILE...
        </div>

    </div>

</main>


<script>

async function loadCharacter() {

    const content = document.getElementById("content");

    /*
        Беремо ID персонажа
        з адреси:

        character.html?id=wanda
    */

    const params = new URLSearchParams(
        window.location.search
    );

    const characterId = params.get("id");


    if (!characterId) {

        content.innerHTML = `
            <div class="error">
                > ERROR 404<br><br>
                PERSONNEL IDENTIFIER NOT FOUND.
            </div>
        `;

        return;

    }


    try {

        const response =
            await fetch("characters-data.json");


        if (!response.ok) {

            throw new Error(
                "Database unavailable"
            );

        }


        const data =
            await response.json();


        /*
            Підтримуємо як масив:

            [
                {...},
                {...}
            ]

            так і:

            {
                "characters": [
                    {...}
                ]
            }
        */

        const characters =
            Array.isArray(data)
                ? data
                : data.characters;


        const character =
            characters.find(
                item =>
                    item.id === characterId
            );


        if (!character) {

            content.innerHTML = `
                <div class="error">

                    > ACCESS ERROR

                    <br><br>

                    PERSONNEL FILE
                    <strong>${characterId}</strong>
                    NOT FOUND.

                </div>
            `;

            return;

        }


        renderCharacter(character);


        /*
            Міняємо назву вкладки
        */

        document.title =
            "S.H.I.E.L.D. // " +
            character.name;


    } catch (error) {

        console.error(error);

        content.innerHTML = `

            <div class="error">

                > DATABASE CONNECTION FAILED.

                <br><br>

                CHECK CHARACTERS-DATA.JSON

            </div>

        `;

    }

}


/* ============================= */
/* RENDER CHARACTER */
/* ============================= */

function renderCharacter(character) {

    const content =
        document.getElementById("content");


    const abilities =
        character.abilities || [];


    const abilitiesHTML =
        abilities.length

        ? `

            <div class="section">

                <div class="section-title">
                    ABILITIES // CAPABILITIES
                </div>

                <div class="abilities">

                    ${abilities
                        .map(
                            ability =>
                                `<span class="ability">
                                    ${ability}
                                </span>`
                        )
                        .join("")
                    }

                </div>

            </div>

        `

        : "";


    content.innerHTML = `

        <article class="dossier">


            <div class="file-number">

                FILE // ${
                    character.file ||
                    character.id.toUpperCase()
                }

            </div>


            <h1 class="character-name">

                ${character.name}

            </h1>


            <div class="status">

                ${
                    character.status ||
                    "ACTIVE"
                }

            </div>


            <div class="info-grid">


                ${
                    character.alias

                    ? `

                        <div class="info-box">

                            <div class="info-label">
                                ALIAS
                            </div>

                            <div class="info-value">
                                ${character.alias}
                            </div>

                        </div>

                    `

                    : ""
                }


                ${
                    character.affiliation

                    ? `

                        <div class="info-box">

                            <div class="info-label">
                                AFFILIATION
                            </div>

                            <div class="info-value">
                                ${character.affiliation}
                            </div>

                        </div>

                    `

                    : ""
                }


                ${
                    character.role

                    ? `

                        <div class="info-box">

                            <div class="info-label">
                                ROLE
                            </div>

                            <div class="info-value">
                                ${character.role}
                            </div>

                        </div>

                    `

                    : ""
                }


                ${
                    character.location

                    ? `

                        <div class="info-box">

                            <div class="info-label">
                                LOCATION
                            </div>

                            <div class="info-value">
                                ${character.location}
                            </div>

                        </div>

                    `

                    : ""
                }


            </div>


            ${
                character.description

                ? `

                    <div class="section">

                        <div class="section-title">
                            PERSONNEL SUMMARY
                        </div>

                        <div class="section-text">

                            ${character.description}

                        </div>

                    </div>

                `

                : ""
            }


            ${abilitiesHTML}


            ${
                character.history

                ? `

                    <div class="section">

                        <div class="section-title">
                            HISTORY
                        </div>

                        <div class="section-text">

                            ${character.history}

                        </div>

                    </div>

                `

                : ""
            }


            ${
                character.notes

                ? `

                    <div class="section">

                        <div class="section-title">
                            ARCHIVE NOTES
                        </div>

                        <div class="section-text">

                            ${character.notes}

                        </div>

                    </div>

                `

                : ""
            }


            <div class="classified">

                ◈ S.H.I.E.L.D. CLASSIFIED
                <br><br>
                UNAUTHORIZED DISTRIBUTION
                OF THIS FILE IS PROHIBITED.

            </div>


        </article>

    `;

}


loadCharacter();

</script>

</body>
</html>
